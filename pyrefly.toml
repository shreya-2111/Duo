search-path = ["backend"]
project-includes = ["backend/**/*.py"]
project-excludes = ["**/__pycache__", "backend/venv", "backend/**/migrations"]
python-version = "3.14"
site-packages-path = ["backend/venv/Lib/site-packages"]

[errors]
missing-attribute = false
missing-import = false
bad-override = false
bad-override-mutable-attribute = false
unsupported-operation = false
bad-assignment = false
bad-argument-type = false
